; PSPNative (generic profile: any PSP game) default DirectX 12 configuration.
; Uses asynchronous GE execution, the cross-unit AOT hot-register cache, native
; indexed/strip submission, packed 0x0115 GPU decode, hardware culling and batch
; merging. Visual/input/audio follow-ups remain tracked separately under the local
; progress directory.
[Display]
Enabled=true
; Output resolution mode: PSP | Desktop | Custom
;   PSP     = 480x272 logical output
;   Desktop = current Windows desktop/monitor resolution
;   Custom  = uses Width and Height below
ResolutionMode=Desktop
; Used by ResolutionMode=Custom. Valid ranges: Width 320-16384, Height 180-16384.
Width=1920
Height=1080
; Fullscreen=true uses a borderless desktop-sized window. In that mode Width/Height
; still define the Custom logical output size, but the window itself fills the desktop.
Fullscreen=true
AspectRatio=Stretch
; Enlarging the frame to the window: Nearest | Bilinear | FSR (AMD FidelityFX Super Resolution 1.0) |
; DLSS (NVIDIA DLSS on RTX cards: nvngx_dlss.dll is fetched next to the game; FSR otherwise;
; for an internal resolution below the window, e.g. InternalResolutionMode=Custom 1280x720 on a 4K screen)
UpscaleFilter=Bilinear
; DLSS preset: Performance | Balanced | Quality | UltraPerformance | DLAA
DlssQuality=Quality
IntegerScale=false
; VSync=true waits for the monitor's refresh: no tearing, frame rate capped at the refresh rate.
VSync=false
; GPU: -1 = the fastest one; 0, 1, 2... = that DXGI adapter (the launcher lists them by name).
Adapter=-1
ShowFPS=false

[Rendering]
Backend=DirectX12
; Native = Direct3D 12; Vulkan = Direct3D 12 on Vulkan (vkd3d-proton + DXVK, put next to the game by
; pspport play when the graphics card supports Vulkan; Direct3D 12 otherwise)
GraphicsApi=Native
HardwareTransform=true
DX12GEColor=true
TextureCacheEntries=8192
TextureCacheMB=512
; Internal render resolution mode: PSP | Scale | Desktop | Custom
;   PSP     = native 480x272 rendering
;   Scale   = 480x272 multiplied by InternalScale (1-8)
;   Desktop = current Windows desktop/monitor resolution
;   Custom  = uses InternalWidth and InternalHeight below
InternalResolutionMode=Desktop
; Used only by InternalResolutionMode=Scale.
InternalScale=2
; Used only by InternalResolutionMode=Custom.
; Valid ranges: InternalWidth 480-16384, InternalHeight 272-16384.
InternalWidth=1920
InternalHeight=1080
MSAA=1
SMAA=false
AnisotropicFiltering=1
DepthPrecision=24
ExperimentalGpuColorPreview=false
GeometryDebugColors=false
DumpGpuFrameVblank=0

[Timing]
FrameRate=30
RealtimeSpeedDiagnostics=false
RealtimeSpeedIntervalVblanks=240

[Audio]
Enabled=true
Volume=100
Diagnostics=false
PrebufferBlocks=8
RecoveryPrebufferBlocks=14

[Widescreen]
; The widescreen patches are written for specific games; off for the generic build.
Enabled=false
AspectRatio=auto

[Project2DFX]
Enabled=false
PerformanceLog=false

[SimulateHDR]
Enabled=false

[DrawDistance]
Enabled=false
World=1.00
Vehicles=1.00
NPCs=1.00

[Controls]
; The right-stick camera is written for specific games; off for the generic build.
CameraStick=false
MouseSensitivity=12
InvertCameraY=false
PedCameraUpLimitDegrees=10
ModernControlScheme=false

[Diagnostics]
LogToFile=true
LogFile=PSPNative.log
FlushEveryLine=false
